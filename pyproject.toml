[tool.poetry]
package-mode = false

[project]
name = "jaeger"
version = "0.1.0"
description = "JAEGER Command and Control System"
authors = [
    {name = "fosven",email = "fosven407@gmail.com"}
]
readme = "README.md"
requires-python = "~3.12"
dependencies = [
    "pillow (>=12.1.1,<13.0.0)",
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pyserial (>=3.5,<4.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pyqt6 (>=6.11.0,<7.0.0)"
]


[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"

[tool.pytest.ini_options]
pythonpath = ["fcp", "."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
